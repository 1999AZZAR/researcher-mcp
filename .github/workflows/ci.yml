name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: a new push makes the old result moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: build, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor: freeSearchService statically imports cheerio, whose
        # undici dependency needs the global File that landed in Node 20. The
        # old engines claim of >=18 was wrong and crashed at import, not just
        # in tests. 22/24 cover current LTS.
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Lint
        # Fails on errors. The 200+ `no-explicit-any` warnings are deliberate
        # (the config sets that rule to "warn") and do not fail the job.
        run: npm run lint

      - name: Test
        run: npm test
